# Deployment template; install the referenced files before starting.
# The host connects to its local Broker; the root radio reaches it through USB.
[broker]
host = "127.0.0.1"
port = 8883
server_name = "ugv-broker.lab"
ca_file = "/etc/changan/pki/ca.pem"
client_cert = "/etc/changan/pki/controller-001/client.pem"
client_key = "/etc/changan/pki/controller-001/client.key"

[paths]
inventory_file = "/etc/changan/nodes.json"
task_database = "/var/lib/changan/tasks.sqlite3"
agent_journal = "/var/lib/changan/agent.json"
lock_file = "/var/lib/changan/controller.lock"

[service]
ugv_id = "ugv-root"
