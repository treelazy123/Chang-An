[project]
name = "changan-mesh-system"
version = "0.7.0"
description = "UGV host runtime and administration for the Changan Mesh system"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyserial>=3.5,<4",
    "paho-mqtt==2.1.0",
    "cryptography>=43,<47",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["host/src"]

[project.scripts]
ugv-service = "changan_ugv.service.server:main"
ugv-console = "changan_ugv.cli:main"
ugv-serial-bridge = "changan_ugv.transport.serial_bridge:main"
